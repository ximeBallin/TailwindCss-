<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>

<div class="w-full">
    <nav class="bg-gray-800 flex items-center justify-between w-full px-6 relative">
        
        <div class="logo p-2 w-48 flex-shrink-0 flex items-center">
            <img src="../../img/logo.png" class="w-full h-auto block" alt="Logo">
        </div>

        <div class="links flex-1 hidden xl:flex justify-center items-center">
            <ul class="menu flex items-center space-x-4 whitespace-nowrap">
                <li><a href="#" class="link">Home</a></li>
                <li><a href="#" class="link">Play Together</a></li>
                <li><a href="#" class="link">Explore</a></li>
                <li><a href="#" class="border-4 border-yellow-400 text-white font-bold px-4 py-2 rounded-full hover:bg-white hover:text-black transition duration-500">Bowser Fury</a></li>
                <li><a href="#" class="rounded-full bg-red-500 text-white font-bold px-5 py-3 hover:text-black hover:bg-white transition duration-500">Buy Now</a></li>
            </ul>
        </div>

        <div class="w-48 hidden xl:block flex-shrink-0"></div>

        <div class="block xl:hidden">
            <a href="#" class="link text-xl font-bold cursor-pointer" id="mobile-menu">Menu</a>
            <ul class="mobile-links hidden w-full absolute z-50 left-0 top-full text-center bg-gray-800 py-4 shadow-lg">
                <li class="py-2"><a href="#" class="link">Home</a></li>
                <li class="py-2"><a href="#" class="link">Play Together</a></li>
                <li class="py-2"><a href="#" class="link">Explore</a></li>
                <li class="py-2"><a href="#" class="inline-block border-4 border-yellow-400 text-white font-bold px-4 py-2 rounded-full hover:bg-white hover:text-black transition duration-500">Bowser Fury</a></li>
                <li class="py-2"><a href="#" class="inline-block rounded-full bg-red-500 text-white font-bold px-5 py-3 hover:text-black hover:bg-white transition duration-500">Buy Now</a></li>
            </ul>
        </div>

    </nav>

    <section class="header">
        <img src="../../img/amigos2.jpg" alt="">

    </section>

</div>

<script>
    const menuButton = document.querySelector('#mobile-menu');

    menuButton.addEventListener('click', (e) => {
        e.preventDefault();
        const menu = document.querySelector('.mobile-links');
        menu.classList.toggle('hidden');
    });
</script>

</body>
</html>
